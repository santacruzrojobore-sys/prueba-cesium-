<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Roboré 3D — Mapa de la Chiquitanía</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.118.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.118.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<style>
  :root{
    --neon:#39FF14; --gold:#FFD700; --sky:#38BDF8; --hot:#FF2D55; --violet:#A855F7;
    --bg:rgba(9,13,21,.66); --line:rgba(57,255,20,.20); --text:#E8EEF5; --soft:#8FA0B3;
    --glass: blur(16px) saturate(150%);
  }
  *{box-sizing:border-box}
  html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#05080d;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--text)}

  /* ambiente: viñeta + scanlines muy sutiles */
  #fx{position:absolute;inset:0;pointer-events:none;z-index:900;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(57,255,20,.018) 3px 4px);}
  .corner{position:absolute;width:26px;height:26px;border:2px solid rgba(57,255,20,.55);z-index:901;pointer-events:none;filter:drop-shadow(0 0 6px rgba(57,255,20,.6))}
  .c-tl{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
  .c-tr{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
  .c-bl{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 8px}
  .c-br{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 8px 0}

  .glass{background:var(--bg);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
  .ui{display:none}
  body.ready .ui{display:block}
  body.ready #hud.ui{display:flex}

  /* token */
  #tokenPanel{position:absolute;inset:0;z-index:1500;display:flex;align-items:center;justify-content:center;padding:1rem;
    background:radial-gradient(circle at 30% 20%, rgba(57,255,20,.10), transparent 50%), radial-gradient(circle at 80% 80%, rgba(56,189,248,.10), transparent 50%), #05080d}
  body.ready #tokenPanel{display:none}
  .tok-card{width:min(420px,100%);padding:1.6rem}
  .logo-row{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
  .logo-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(57,255,20,.25),rgba(56,189,248,.18));border:1px solid var(--line);box-shadow:0 0 22px rgba(57,255,20,.25)}
  .logo-row h1{font-size:1.25rem;margin:0;letter-spacing:.14em;font-weight:700}
  .logo-row h1 span{color:var(--neon);text-shadow:0 0 14px rgba(57,255,20,.7)}
  .logo-row small{display:block;color:var(--soft);font-size:.72rem;letter-spacing:.06em;margin-top:2px}
  .tok-card label{font-size:.78rem;color:var(--soft)}
  .tok-card input{width:100%;margin-top:.4rem;padding:.75rem .9rem;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-size:.85rem;outline:none}
  .tok-card input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(57,255,20,.12)}
  .btn-main{width:100%;margin-top:.9rem;padding:.8rem;border:0;border-radius:10px;font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;cursor:pointer;color:#06210a;background:linear-gradient(135deg,#39FF14,#7CFF5B);box-shadow:0 8px 28px rgba(57,255,20,.35);transition:.2s}
  .btn-main:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .tok-card small.help{display:block;margin-top:.7rem;color:var(--soft);font-size:.72rem}
  #loaderMsg{margin-top:.8rem;font-size:.78rem;color:var(--sky);min-height:1.1em}
  #loaderMsg.err{color:#ff6b81}

  /* panel superior izquierdo */
  #brand{position:absolute;top:22px;left:22px;z-index:1000;width:min(340px,calc(100vw - 44px));padding:1rem}
  #brand .logo-row{margin-bottom:.8rem}
  .search{position:relative}
  .search input{width:100%;padding:.65rem .8rem .65rem 2.2rem;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-size:.84rem;outline:none}
  .search input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(57,255,20,.12)}
  .search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);opacity:.6}
  #results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;border-radius:12px;overflow:hidden;display:none;max-height:260px;overflow-y:auto}
  .res{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;cursor:pointer;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.05)}
  .res:hover{background:rgba(57,255,20,.10)}
  .res i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .res small{margin-left:auto;color:var(--soft);font-size:.68rem}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
  .chip{display:flex;align-items:center;gap:.45rem;padding:.42rem .7rem;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;transition:.18s;width:auto;margin:0}
  .chip i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .chip b{font-weight:700;color:var(--soft)}
  .chip:hover{border-color:rgba(255,255,255,.35)}
  .chip.off{opacity:.38;filter:grayscale(.7)}
  .zonas{margin-top:.65rem;font-size:.66rem;color:var(--soft);line-height:1.5}
  .zonas span{display:inline-flex;align-items:center;gap:.3rem;margin-right:.6rem}
  .zonas i{width:7px;height:7px;border-radius:50%;display:inline-block}

  /* controles */
  #ctrls{position:absolute;right:22px;bottom:96px;z-index:1000;display:flex;flex-direction:column;gap:6px;padding:6px}
  #ctrls button{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--neon);font:inherit;font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center;margin:0;padding:0;transition:.15s}
  #ctrls button:hover{background:rgba(57,255,20,.14);border-color:var(--line);transform:scale(1.06)}
  #ctrls button:active{transform:scale(.94)}
  #ctrls hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:2px 6px;width:auto}

  /* HUD */
  #hud{position:absolute;left:22px;bottom:22px;z-index:1000;align-items:center;gap:.9rem;padding:.55rem .9rem;font-size:.72rem;letter-spacing:.05em}
  #hud .k{color:var(--soft);margin-right:.35rem}
  #hud .v{color:var(--neon);font-weight:700;font-variant-numeric:tabular-nums}
  #compass{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
  #needle{position:absolute;inset:3px;transition:transform .15s linear}
  #needle::before{content:'';position:absolute;left:50%;top:0;width:0;height:0;margin-left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:14px solid var(--neon);filter:drop-shadow(0 0 4px var(--neon))}
  #needle::after{content:'';position:absolute;left:50%;bottom:0;width:0;height:0;margin-left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:14px solid rgba(255,255,255,.35)}

  /* tarjeta de detalle */
  #card{position:absolute;top:22px;right:22px;bottom:22px;z-index:1200;width:min(380px,calc(100vw - 44px));display:none;flex-direction:column;overflow:hidden;animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
  #card.open{display:flex}
  @keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  #cardImgWrap{position:relative;height:210px;flex:none;background:linear-gradient(135deg,#0d1a10,#0a1320)}
  #cardImg{width:100%;height:100%;object-fit:cover;display:block}
  #cardImgWrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(9,13,21,1) 0%,rgba(9,13,21,0) 60%)}
  #cardClose{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-size:15px;margin:0;padding:0;display:grid;place-items:center}
  #cardClose:hover{background:rgba(255,45,85,.5)}
  #cardBody{padding:0 1.1rem 1.1rem;overflow-y:auto;flex:1;margin-top:-34px;position:relative;z-index:2}
  #cardName{font-size:1.28rem;line-height:1.2;margin:0 0 .55rem;font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.8rem}
  .tag{font-size:.68rem;font-weight:700;padding:.24rem .6rem;border-radius:999px;border:1px solid currentColor;letter-spacing:.03em}
  #cardDesc{font-size:.84rem;color:#c5d0dc;line-height:1.55;margin:0 0 .8rem}
  .rows{display:grid;gap:.4rem;margin-bottom:.9rem}
  .row{display:flex;gap:.7rem;padding:.55rem .7rem;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:.8rem}
  .row .k{color:var(--soft);min-width:92px;flex:none}
  .row .v{color:var(--text);font-weight:500}
  .dist{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-radius:12px;background:rgba(57,255,20,.07);border:1px solid var(--line);font-size:.8rem;margin-bottom:.9rem}
  .dist b{color:var(--neon);font-size:1rem}
  .actions{display:flex;gap:.5rem}
  .actions a,.actions button{flex:1;padding:.75rem;border-radius:10px;border:0;font:inherit;font-weight:700;font-size:.78rem;text-align:center;text-decoration:none;cursor:pointer;margin:0;transition:.2s;letter-spacing:.03em}
  .actions a{background:#4285F4;color:#fff}
  .actions button{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.14)}
  .actions a:hover,.actions button:hover{filter:brightness(1.15);transform:translateY(-1px)}

  /* cesium: credits discretos */
  .cesium-viewer-bottom{bottom:0;left:50%;transform:translateX(-50%);right:auto;opacity:.75}
  .cesium-widget-credits{font-size:10px}

  @media (max-width:700px){
    #brand{top:12px;left:12px;width:calc(100vw - 24px);padding:.8rem}
    .zonas{display:none}
    #card{top:auto;left:12px;right:12px;bottom:12px;width:auto;max-height:62vh}
    #cardImgWrap{height:150px}
    #ctrls{right:12px;bottom:auto;top:50%;transform:translateY(-50%)}
    #hud{left:12px;bottom:12px}
    .corner{display:none}
  }
</style>
</head>
<body>

<div id="cesiumContainer"></div>
<div id="fx"></div>
<div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>

<!-- TOKEN -->
<div id="tokenPanel">
  <div class="tok-card glass">
    <div class="logo-row">
      <div class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#39FF14" stroke-width="1.8"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
      <div><h1>ROBORÉ <span>3D</span></h1><small>CHIQUITANÍA · MAPA INTERACTIVO</small></div>
    </div>
    <label for="tokenInput">Pega tu access token de Cesium ion</label>
    <input id="tokenInput" type="text" placeholder="eyJhbGci..." autocomplete="off" spellcheck="false">
    <button class="btn-main" onclick="iniciarVisor()">Cargar mapa de Roboré</button>
    <div id="loaderMsg"></div>
    <small class="help">Consíguelo gratis en ion.cesium.com/tokens</small>
  </div>
</div>

<!-- MARCA + BUSCADOR + FILTROS -->
<div id="brand" class="ui glass">
  <div class="logo-row">
    <div class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#39FF14" stroke-width="1.8"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
    <div><h1>ROBORÉ <span>3D</span></h1><small>CHIQUITANÍA · MAPA INTERACTIVO</small></div>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Buscar lugar, hotel o restaurante…" autocomplete="off">
    <div id="results" class="glass"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="zonas">
    Turismo por zona:
    <span><i style="background:#39FF14"></i>Roboré</span>
    <span><i style="background:#FFD700"></i>Chochís</span>
    <span><i style="background:#38BDF8"></i>Aguas Calientes</span>
  </div>
</div>

<!-- CONTROLES -->
<div id="ctrls" class="ui glass">
  <button onclick="zoomIn()" title="Acercar">+</button>
  <button onclick="zoomOut()" title="Alejar">−</button>
  <hr>
  <button onclick="orbitar(15)" title="Girar a la izquierda">↺</button>
  <button onclick="orbitar(-15)" title="Girar a la derecha">↻</button>
  <button onclick="inclinar(8)" title="Vista más vertical">⤒</button>
  <button onclick="inclinar(-8)" title="Vista más inclinada">⤓</button>
  <hr>
  <button onclick="volverARobore()" title="Centrar en Roboré">◎</button>
</div>

<!-- HUD -->
<div id="hud" class="ui glass">
  <div id="compass"><div id="needle"></div></div>
  <div><span class="k">ALT</span><span class="v" id="hAlt">—</span></div>
  <div><span class="k">RUMBO</span><span class="v" id="hHdg">—</span></div>
  <div><span class="k">PUNTOS</span><span class="v" id="hCnt">—</span></div>
</div>

<!-- DETALLE -->
<div id="card" class="ui glass">
  <div id="cardImgWrap">
    <img id="cardImg" alt="">
    <button id="cardClose" onclick="cerrarDetalle()" title="Cerrar (Esc)">✕</button>
  </div>
  <div id="cardBody">
    <h2 id="cardName"></h2>
    <div class="tags" id="cardTags"></div>
    <p id="cardDesc"></p>
    <div class="rows" id="cardRows"></div>
    <div class="dist" id="cardDist"></div>
    <div class="actions">
      <a id="btnLlegar" href="#" target="_blank" rel="noopener">🧭 Cómo llegar</a>
      <button onclick="centrarSeleccion()">◎ Centrar</button>
    </div>
  </div>
</div>

  const CHOCHIS = { lon: -60.03, lat: -18.15 };

  const atractivos = [

  function distKm(lon1, lat1, lon2, lat2) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function zonaDe(it) {
    const d = [
      ['Roboré', distKm(it.lon, it.lat, ROBORE.lon, ROBORE.lat)],
      ['Chochís', distKm(it.lon, it.lat, CHOCHIS.lon, CHOCHIS.lat)],
      ['Aguas Calientes', distKm(it.lon, it.lat, AGUAS.lon, AGUAS.lat)]
    ].sort((a, b) => a[1] - b[1]);
    return d[0][0];
  }

  // Pines que comparten coordenadas exactas se separan ~80 m para poder verlos y tocarlos
  (function separarDuplicados() {

      it.zona = zonaDe(it);
      const key = it.lon.toFixed(4) + ',' + it.lat.toFixed(4);
      const k = vistos[key] = (vistos[key] ?? -1) + 1;
      if (k === 0) { it.plon = it.lon; it.plat = it.lat; }
      else {
        const ang = k * 2.4, r = 0.0007 * Math.ceil(k / 2);
        it.plon = it.lon + Math.cos(ang) * r;
        it.plat = it.lat + Math.sin(ang) * r;
      }
    });
  })();

  function crearPinSVG(colorHex) {
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="90" height="120" viewBox="0 0 90 120">
        <defs>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <radialGradient id="ring" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="${colorHex}" stop-opacity="0.6"/>
            <stop offset="60%" stop-color="${colorHex}" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="${colorHex}" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="gota" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="${colorHex}"/><stop offset="100%" stop-color="#0D1117"/>
          </linearGradient>
        </defs>
        <circle cx="45" cy="92" r="30" fill="url(#ring)"/>
        <ellipse cx="45" cy="96" rx="12" ry="3.5" fill="rgba(0,0,0,0.45)"/>
        <g filter="url(#glow)">
          <path d="M45 8 C26 8 12 24 12 44 C12 68 45 100 45 100 C45 100 78 68 78 44 C78 24 64 8 45 8 Z" fill="url(#gota)" stroke="${colorHex}" stroke-width="2.5"/>
          <circle cx="45" cy="44" r="9" fill="#0D1117" stroke="${colorHex}" stroke-width="2"/>
          <circle cx="45" cy="44" r="4" fill="${colorHex}"/>
        </g>
      </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }
  const cachePines = {};
  function pinPara(colorHex) { return cachePines[colorHex] || (cachePines[colorHex] = crearPinSVG(colorHex)); }

  const cacheCluster = {};
  function iconoCluster(n) {
    const key = n > 99 ? '99+' : String(n);
    if (cacheCluster[key]) return cacheCluster[key];
    const c = document.createElement('canvas'); c.width = c.height = 72;
    const g = c.getContext('2d');
    g.shadowColor = '#39FF14'; g.shadowBlur = 14;
    g.beginPath(); g.arc(36, 36, 25, 0, Math.PI * 2);
    g.fillStyle = 'rgba(8,14,22,0.94)'; g.fill();
    g.lineWidth = 3; g.strokeStyle = '#39FF14'; g.stroke();
    g.shadowBlur = 0;
    g.beginPath(); g.arc(36, 36, 31, 0, Math.PI * 2);
    g.lineWidth = 1; g.strokeStyle = 'rgba(57,255,20,0.35)'; g.stroke();
    g.fillStyle = '#fff'; g.font = '700 22px "Space Grotesk", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(key, 36, 37);
    return cacheCluster[key] = c.toDataURL('image/png');
  }

  // ---- carga de fotos: prueba cada URL en orden (una imagen vacía/404 pasa a la siguiente) ----
  function cargarPrimeraValida(urls) {
    return new Promise(resolve => {
      let i = 0;
      const siguiente = () => {
        if (i >= urls.length) return resolve(null);
        const url = urls[i++];
        const img = new Image();
        if (!url.startsWith('data:')) img.crossOrigin = 'anonymous';
        img.onload = () => (img.naturalWidth > 1 ? resolve({ img, url }) : siguiente());
        img.onerror = siguiente;
        img.src = url;
      };
      siguiente();
    });
  }

  const colaCarga = []; let cargandoAhora = 0; const MAX_CONC = 4;
  function procesarCola() {
    while (cargandoAhora < MAX_CONC && colaCarga.length) {
      const tarea = colaCarga.shift(); cargandoAhora++;
      tarea().finally(() => { cargandoAhora--; procesarCola(); });
    }
  }
  const CW = 90, CH = 120, PIN_D = 'M45 8 C26 8 12 24 12 44 C12 68 45 100 45 100 C45 100 78 68 78 44 C78 24 64 8 45 8 Z';

  function fotoPinPromise(urls, colorHex) {
    return new Promise(resolve => {
      colaCarga.push(async () => {
        const r = await cargarPrimeraValida(urls);
        if (!r) { console.warn('Sin foto válida:', urls[0]); return resolve(null); }
        try {
          const canvas = document.createElement('canvas'); canvas.width = CW; canvas.height = CH;
          const ctx = canvas.getContext('2d'); const pin = new Path2D(PIN_D); const img = r.img;
          ctx.save(); ctx.shadowColor = colorHex; ctx.shadowBlur = 18; ctx.fillStyle = colorHex; ctx.fill(pin); ctx.restore();
          ctx.save(); ctx.clip(pin);
          const s = Math.max(CW / img.width, CH / img.height), dw = img.width * s, dh = img.height * s;
          ctx.drawImage(img, (CW - dw) / 2, (CH - dh) / 2 - 6, dw, dh);
          const g = ctx.createLinearGradient(0, CH * 0.55, 0, CH);
          g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH); ctx.restore();
          ctx.lineWidth = 3; ctx.strokeStyle = colorHex; ctx.stroke(pin);
          ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke(pin);
          resolve(canvas.toDataURL('image/png'));
        } catch (e) { resolve(null); }
      });
      procesarCola();
    });
  }

  let viewer, ds, selectedItem = null, routeEntity = null, ringEntity = null;

  function setMsg(t, err) { const m = document.getElementById('loaderMsg'); m.textContent = t; m.className = err ? 'err' : ''; }

  async function iniciarVisor() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) { setMsg('Pega tu token de Cesium ion primero.', true); return; }
    Cesium.Ion.defaultAccessToken = token;

    try {
      setMsg('Cargando terreno 3D…');
      let terrainProvider;
      try { terrainProvider = await Cesium.createWorldTerrainAsync(); }
      catch (e) { console.warn('Terreno no disponible', e); }

      viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: terrainProvider || new Cesium.EllipsoidTerrainProvider(),
        timeline: false, animation: false, baseLayerPicker: false, geocoder: false, homeButton: false,
        sceneModePicker: false, navigationHelpButton: false, infoBox: false, selectionIndicator: false,
        fullscreenButton: false, vrButton: false, msaaSamples: 4
      });

      setMsg('Cargando imágenes satelitales…');
      try {
        const bing = await Cesium.IonImageryProvider.fromAssetId(2);
        viewer.imageryLayers.addImageryProvider(bing);
      } catch (e) { console.warn('Bing Aerial no cargó.', e); }

      viewer.scene.globe.showGroundAtmosphere = true;
      viewer.scene.skyAtmosphere.brightnessShift = -0.1;
      viewer.scene.fog.density = 0.00018;

      const ctl = viewer.scene.screenSpaceCameraController;
      ctl.minimumZoomDistance = 80; ctl.maximumZoomDistance = 60000;

      // altura real del terreno para cada pin
      setMsg('Ajustando puntos al relieve…');
      let alturas = null;
      if (terrainProvider) {
        try {
          const carts = ITEMS.map(i => Cesium.Cartographic.fromDegrees(i.plon, i.plat));
          await Cesium.sampleTerrainMostDetailed(terrainProvider, carts);
          alturas = carts.map(c => (Number.isFinite(c.height) ? c.height : null));
        } catch (e) { console.warn('No se pudo muestrear el terreno', e); }
      }

      ds = new Cesium.CustomDataSource('lugares');
      await viewer.dataSources.add(ds);

      ITEMS.forEach((it, idx) => {
        const h = alturas && alturas[idx] != null ? alturas[idx] + 4 : null;
        const ent = ds.entities.add({
          id: it.id,
          name: it.nombre,
          position: Cesium.Cartesian3.fromDegrees(it.plon, it.plat, h ?? 0),
          billboard: {
            image: pinPara(it.color),
            width: 52, height: 70,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            heightReference: h == null ? Cesium.HeightReference.CLAMP_TO_GROUND : Cesium.HeightReference.NONE,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            scaleByDistance: new Cesium.NearFarScalar(300, 1.15, 25000, 0.55)
          },
          label: {
            text: it.nombre,
            font: '600 12px "Space Grotesk", sans-serif',
            fillColor: Cesium.Color.WHITE,
            style: Cesium.LabelStyle.FILL,
            showBackground: true,
            backgroundColor: new Cesium.Color(0.03, 0.05, 0.09, 0.78),
            backgroundPadding: new Cesium.Cartesian2(9, 5),
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -76),
            heightReference: h == null ? Cesium.HeightReference.CLAMP_TO_GROUND : Cesium.HeightReference.NONE,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 4500)
          }
        });
        ENT[it.id] = ent;
        const urls = candidatos(it.nombre);
        if (urls.length) {
          fotoPinPromise(urls, it.color).then(dataUrl => { if (dataUrl) ent.billboard.image = dataUrl; });
        }
      });

      // agrupa pines cercanos en burbujas con contador
      ds.clustering.pixelRange = 44;
      ds.clustering.minimumClusterSize = 2;
      ds.clustering.clusterLabels = true;
      ds.clustering.clusterBillboards = true;
      ds.clustering.clusterPoints = true;
      ds.clustering.clusterEvent.addEventListener((clustered, cluster) => {
        cluster.label.show = false;
        cluster.point.show = false;
        cluster.billboard.show = true;
        cluster.billboard.id = cluster.label.id;
        cluster.billboard.verticalOrigin = Cesium.VerticalOrigin.CENTER;
        cluster.billboard.image = iconoCluster(clustered.length);
        cluster.billboard.width = 54; cluster.billboard.height = 54;
        cluster.billboard.disableDepthTestDistance = Number.POSITIVE_INFINITY;
      });
      ds.clustering.enabled = false; ds.clustering.enabled = true;

      construirUI();
      configurarEventos();

      // interfaz visible + entrada cinematográfica
      document.body.classList.add('ready');
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(ROBORE.lon, ROBORE.lat - 0.25, 70000),
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-55), roll: 0 }
      });
      volverARobore(3.6);
    } catch (e) {
      console.error(e);
      setMsg('No se pudo iniciar. Revisa que el token sea válido. (' + (e.message || e) + ')', true);
    }
  }

  // ================= INTERFAZ =================
  function construirUI() {
    const chips = document.getElementById('chips');
    chips.innerHTML = '';
    Object.keys(CATS).forEach(k => {
      const n = ITEMS.filter(i => i.cat === k).length;
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.cat = k;
      b.innerHTML = `<i style="background:${CATS[k].color};color:${CATS[k].color}"></i>${CATS[k].label} <b>${n}</b>`;
      b.onclick = () => toggleCat(k, b);
      chips.appendChild(b);
    });
    actualizarContador();

    const q = document.getElementById('q'), box = document.getElementById('results');
    const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    q.addEventListener('input', () => {
      const t = norm(q.value.trim());
      if (!t) { box.style.display = 'none'; return; }
      const r = ITEMS.filter(i => filtros[i.cat] && norm(i.nombre).includes(t)).slice(0, 7);
      box.innerHTML = r.length
        ? r.map(i => `<div class="res" data-id="${i.id}"><i style="background:${i.color};color:${i.color}"></i>${i.nombre}<small>${i.zona}</small></div>`).join('')
        : '<div class="res" style="cursor:default;color:var(--soft)">Sin resultados</div>';
      box.style.display = 'block';
    });
    box.addEventListener('click', e => {
      const r = e.target.closest('.res'); if (!r || !r.dataset.id) return;
      box.style.display = 'none'; q.value = ''; q.blur();
      seleccionar(ITEM_BY_ID[r.dataset.id], true);
    });
    document.addEventListener('click', e => { if (!e.target.closest('.search')) box.style.display = 'none'; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarDetalle(); });
  }

  function toggleCat(k, btn) {
    filtros[k] = !filtros[k];
    btn.classList.toggle('off', !filtros[k]);
    ITEMS.forEach(i => { if (i.cat === k) ENT[i.id].show = filtros[k]; });
    if (selectedItem && selectedItem.cat === k && !filtros[k]) cerrarDetalle();
    actualizarContador();
  }
  function actualizarContador() {
    document.getElementById('hCnt').textContent = ITEMS.filter(i => filtros[i.cat]).length;
  }

  function configurarEventos() {
    const canvas = viewer.scene.canvas;
    const handler = new Cesium.ScreenSpaceEventHandler(canvas);

    handler.setInputAction(mov => {
      const picked = viewer.scene.pick(mov.position);
      if (!Cesium.defined(picked) || !picked.id) return;
      // burbuja de grupo: acerca la cámara a esos puntos
      if (Array.isArray(picked.id)) {
        const pos = picked.id.map(e => e.position.getValue(viewer.clock.currentTime));
        const bs = Cesium.BoundingSphere.fromPoints(pos);
        viewer.camera.flyToBoundingSphere(bs, {
          duration: 1.1,
          offset: new Cesium.HeadingPitchRange(viewer.camera.heading, Cesium.Math.toRadians(-50), Math.max(bs.radius * 3.2, 350))
        });
        return;
      }
      const it = ITEM_BY_ID[picked.id.id];
      if (it) seleccionar(it, false);
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    handler.setInputAction(mov => {
      const p = viewer.scene.pick(mov.endPosition);
      canvas.style.cursor = Cesium.defined(p) && p.id ? 'pointer' : 'default';
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    // HUD
    let last = 0;
    viewer.scene.postRender.addEventListener(() => {
      const now = performance.now(); if (now - last < 200) return; last = now;
      const cam = viewer.camera, alt = cam.positionCartographic.height;
      const hdg = (Cesium.Math.toDegrees(cam.heading) + 360) % 360;
      document.getElementById('hAlt').textContent = alt >= 1000 ? (alt / 1000).toFixed(1) + ' km' : Math.round(alt) + ' m';
      document.getElementById('hHdg').textContent = Math.round(hdg) + '°';
      document.getElementById('needle').style.transform = 'rotate(' + (-hdg) + 'deg)';
    });
  }

  // ================= SELECCIÓN / DETALLE =================
  function limpiarSeleccion() {
    if (routeEntity) { viewer.entities.remove(routeEntity); routeEntity = null; }
    if (ringEntity) { viewer.entities.remove(ringEntity); ringEntity = null; }
  }

  function seleccionar(it, volar) {
    if (!it) return;
    selectedItem = it;
    limpiarSeleccion();
    const color = Cesium.Color.fromCssColorString(it.color);
    const km = distKm(ROBORE.lon, ROBORE.lat, it.lon, it.lat);

    // ruta luminosa desde el centro de Roboré (solo la del lugar elegido)
    if (km > 0.4) {
      routeEntity = viewer.entities.add({
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray([ROBORE.lon, ROBORE.lat, it.plon, it.plat]),
          width: 6, clampToGround: true,
          material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.28, color })
        }
      });
    }
    // anillo pulsante sobre el punto
    const t0 = performance.now();
    const fase = () => ((performance.now() - t0) % 1900) / 1900;
    ringEntity = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(it.plon, it.plat),
      ellipse: {
        semiMajorAxis: new Cesium.CallbackProperty(() => 25 + 130 * fase(), false),
        semiMinorAxis: new Cesium.CallbackProperty(() => 25 + 130 * fase(), false),
        material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(() => color.withAlpha(0.5 * (1 - fase())), false)),
        classificationType: Cesium.ClassificationType.TERRAIN
      }
    });

    mostrarDetalle(it, km);
    if (volar) {
      viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(ENT[it.id].position.getValue(viewer.clock.currentTime), 1), {
        duration: 1.6,
        offset: new Cesium.HeadingPitchRange(viewer.camera.heading, Cesium.Math.toRadians(-42), 1400)
      });
    }
  }

  function mostrarDetalle(it, km) {
    const card = document.getElementById('card');
    const img = document.getElementById('cardImg');
    const urls = candidatos(it.nombre).slice();
    const wrap = document.getElementById('cardImgWrap');
    wrap.style.display = 'block';
    img.style.display = 'block';
    let k = 0;
    img.onerror = () => { if (k < urls.length) img.src = urls[k++]; else wrap.style.display = 'none'; };
    img.onload = () => { if (img.naturalWidth <= 1) img.onerror(); };
    if (urls.length) img.onerror(); else wrap.style.display = 'none';

    document.getElementById('cardName').textContent = it.nombre;

    const tags = [];
    tags.push(`<span class="tag" style="color:${it.color}">${CATS[it.cat].icon} ${CATS[it.cat].label.replace(/s$/, '').replace('Hotele', 'Hotel')}</span>`);
    tags.push(`<span class="tag" style="color:#FFD700">★ ${it.rating}</span>`);
    tags.push(`<span class="tag" style="color:#8FA0B3">${it.zona}</span>`);
    document.getElementById('cardTags').innerHTML = tags.join('');

    const row = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
    let desc = '', rows = '';
    if (it.cat === 'hotel') {
      desc = 'Alojamiento en la Chiquitanía.';
      rows = row('Precio', `Bs ${it.precio} / noche`) + row('Servicios', it.servicios);
    } else if (it.cat === 'restaurante') {
      desc = it.especialidad + '.';
      rows = row('Horario', it.horario) + row('Almuerzo desde', `Bs ${it.precio}`);
    } else {
      desc = it.descripcion;
      rows = row('Precio', `Bs ${it.precioLocal} local · Bs ${it.precioExtranjero} extranjero`) +
             row('Horario', it.horario) + row('Dificultad', it.dificultad) + row('Distancia', it.distancia) +
             row('Cómo llegar', it.transporte) + row('Servicios', it.servicios) + row('Recomendación', it.recomendacion);
    }
    document.getElementById('cardDesc').textContent = desc;
    document.getElementById('cardRows').innerHTML = rows;
    document.getElementById('cardDist').innerHTML = km > 0.4
      ? `<span>📏</span><span>A <b>${km.toFixed(1)} km</b> del centro de Roboré <span style="color:var(--soft)">(en línea recta)</span></span>`
      : `<span>📏</span><span>En el <b>centro de Roboré</b></span>`;
    document.getElementById('btnLlegar').href = 'https://www.google.com/maps/dir/?api=1&destination=' + it.lat + ',' + it.lon;
    card.classList.add('open');
    document.getElementById('cardBody').scrollTop = 0;
  }

  function cerrarDetalle() {
    document.getElementById('card').classList.remove('open');
    selectedItem = null;
    if (viewer) limpiarSeleccion();
  }
  function centrarSeleccion() { if (selectedItem) seleccionar(selectedItem, true); }

  // ================= CONTROLES DE CÁMARA =================
  function puntoCentro() {
    const c = new Cesium.Cartesian2(viewer.canvas.clientWidth / 2, viewer.canvas.clientHeight / 2);
    const ray = viewer.camera.getPickRay(c);
    return ray ? viewer.scene.globe.pick(ray, viewer.scene) : undefined;
  }
  function orbitarPitch(dHeadingDeg, dPitchDeg) {
    if (!viewer) return;
    const target = puntoCentro(); if (!target) return;
    const cam = viewer.camera;
    const range = Cesium.Cartesian3.distance(cam.positionWC, target);
    const h = cam.heading + Cesium.Math.toRadians(dHeadingDeg);
    const p = Cesium.Math.clamp(cam.pitch + Cesium.Math.toRadians(dPitchDeg), Cesium.Math.toRadians(-89), Cesium.Math.toRadians(-12));
    cam.lookAt(target, new Cesium.HeadingPitchRange(h, p, range));
    cam.lookAtTransform(Cesium.Matrix4.IDENTITY);
  }
  window.orbitar = d => orbitarPitch(d, 0);
  window.inclinar = d => orbitarPitch(0, d);
  window.zoomIn = function () {
    if (!viewer) return;
    const h = viewer.camera.positionCartographic.height;
    viewer.camera.zoomIn(h - Math.max(h / 1.6, 90));
  };
  window.zoomOut = function () {
    if (!viewer) return;
    const h = viewer.camera.positionCartographic.height;
    viewer.camera.zoomOut(Math.min(h * 1.6, 60000) - h);
  };
  window.volverARobore = function (dur) {
    if (!viewer) return;
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(ROBORE.lon, ROBORE.lat - 0.05, 12000),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-50), roll: 0 },
      duration: typeof dur === 'number' ? dur : 1.8
    });
  };
  window.iniciarVisor = iniciarVisor;
  window.cerrarDetalle = cerrarDetalle;
  window.centrarSeleccion = centrarSeleccion;
</script>
